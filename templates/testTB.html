<!DOCTYPE html>

    <style>
        /* Will be pasted into its own CSS file but i wanted to show it here for now.*/
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Courier Prime", monospace;
            font-weight: 400;
            font-style: normal;
        }
        
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background-color: #f8f8f8;
            color: #333;
            margin: 0;
            padding: 0;
        }
        
        header {
            position: relative;
            width: 100%;
            padding: 20px;
            color: white;
            text-align: center;
            z-index: 2;
            background: rgba(0, 0, 0, 0.5);
        }

        .slideshow {
            position: relative;
            width: 100%;
            height: 80vh; /* Adjust the height as needed */
            overflow: hidden;
            z-index: 1;
        }

        .Slides {
            display: none;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .Slides video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Text overlay */
        .header {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            color: white;
            font-size: 36px;
        }
        .header a {
            font-size: 18px;
        }

        header h1 {
            font-size: 60px;
            margin-bottom: 20px;
            background-color: transparent;
            padding: 10px 20px;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            text-align: center;
            position: absolute;
            top: calc(100% + 10px);
            width: 100%;
            background: rgba(168, 166, 166, 0.5);
            z-index: 2;
        }

        nav ul li {
            display: inline;
            margin-right: 10px; 
        }

        nav ul li a {
            color: #ffffff;
            text-decoration: none;
        }

        nav ul li a:hover {
            background-color: #999;
        }

        .dotPlace {
            text-align: center;
            margin-top: 20px;
            z-index: 2;
        }

        .dot {
            height: 15px;
            width: 15px;
            margin: 0 5px;
            background-color: #bbb;
            border-radius: 50%;
            display: inline-block;
            transition: background-color 0.3s ease;
            cursor: pointer;
        }

        .active {
            background-color: #717171;
        }

        .prev, .next {
            display: none;
        }

        .searchbar {
            text-align: center;
            margin-top: 20px;
            z-index: 2;
            
        }

        .searchbar input {
            width: 400px;
            height: 40px;
        }

        .blogpost {
            text-align: center;
            margin-top: 20px;
            z-index: 2;
        }

        .blogpost h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .postPlace {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .post {
            width: 30%;
            margin: 0 1.5%;
            margin-bottom: 20px;
            background-color: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .post:hover {
            transform: translateY(-5px);
        }

        .post img {
            width: 100%;
            height: auto;
            border-bottom: 1px solid #ccc;
        }

        .post h3 {
            font-size: 18px;
            margin: 10px 0;
        }

    </style>

    <script>
        var slideIndex = 1;
        showSlides(slideIndex);

        function plusSlides(n) {
            showSlides(slideIndex += n);
        }

        function currentSlide(n) {
            showSlides(slideIndex = n);
        }

        function showSlides(n) {
            var i;
            var slides = document.getElementsByClassName("Slides");
            var dots = document.getElementsByClassName("dot");
            if (n > slides.length) {slideIndex = 1}    
            if (n < 1) {slideIndex = slides.length}
            for (i = 0; i < slides.length; i++) {
                slides[i].style.display = "none";  
            }
            for (i = 0; i < dots.length; i++) {
                dots[i].className = dots[i].className.replace(" active", "");
            }
            slides[slideIndex-1].style.display = "block";  
            dots[slideIndex-1].className += " active";
        }

        function nextSlide() {
            plusSlides(1);
        }
    </script>
